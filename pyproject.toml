[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-tts-gateway"
version = "0.1.0"
description = "Universal OpenAI-compatible Text-to-Speech (TTS) Gateway supporting Edge-TTS, Piper-TTS, and Kokoro-TTS"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Universal TTS Team" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "edge-tts>=6.1.10",
    "soundfile>=0.12.1",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
all = [
    "kokoro-onnx>=0.3.0",
    "piper-tts>=1.2.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "openai>=1.14.0",
    "requests>=2.31.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["gateway*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
